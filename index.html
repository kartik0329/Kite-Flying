<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flying Kite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to top, #ff512f, #f09819, #87ceeb);
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Text */
.text {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 28px;
  color: #fff;
  animation: fade 2s infinite alternate;
}

/* Person */
.person {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
}

.head {
  width: 26px;
  height: 26px;
  background: #ffcc99;
  border-radius: 50%;
  margin: auto;
}

.body {
  width: 8px;
  height: 45px;
  background: #222;
  margin: auto;
}

/* Kite */
.kite {
  position: absolute;
  width: 50px;
  height: 50px;
  transform: rotate(45deg);
  animation: fly 8s linear infinite, swing 2s ease-in-out infinite;
}

.kite::before,
.kite::after {
  content: "";
  position: absolute;
  width: 50px;
  height: 50px;
  background: inherit;
}

.kite::before { left: -25px; }
.kite::after { top: -25px; }

.tail {
  position: absolute;
  width: 3px;
  height: 100px;
  background: #444;
  top: 50px;
  left: 24px;
}

/* Different kites */
.k1 { background: red; animation-delay: 0s; }
.k2 { background: yellow; animation-delay: 2s; }
.k3 { background: lime; animation-delay: 4s; }

/* Animations */
@keyframes fly {
  0% { left: -10%; top: 180px; }
  50% { left: 50%; top: 60px; }
  100% { left: 110%; top: 140px; }
}

@keyframes swing {
  0% { transform: rotate(40deg); }
  50% { transform: rotate(50deg); }
  100% { transform: rotate(40deg); }
}

@keyframes fade {
  from { opacity: 0.6; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="text" id="msg">Karthik Bhai Dosto ke sath Patang🪁 Uda Rahe hai.</div>

<div class="text" id="msg">Free ho kar call karenge.</div>

<!-- Person -->
<div class="person">
  <div class="head"></div>
  <div class="body"></div>
</div>

<!-- Multiple Kites -->
<div class="kite k1"><div class="tail"></div></div>
<div class="kite k2"><div class="tail"></div></div>
<div class="kite k3"><div class="tail"></div></div>

<!-- Wind Sound -->
<audio id="wind" autoplay loop>
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-wind-whistling-1237.mp3" type="audio/mpeg">
</audio>

<script>
// Auto text change
setTimeout(() => {
  document.getElementById("msg").innerText = "Back later 👋";
}, 5000);
</script>

</body>
</html>
